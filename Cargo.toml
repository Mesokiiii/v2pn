[workspace]
resolver = "2"
members = [
    "crates/app-core",
    "crates/tauri-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["v2pn contributors"]
repository = "https://github.com/your-org/v2pn"
rust-version = "1.80"

[workspace.dependencies]
# async / runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# net & web
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream", "json"] }
url = "2"

# parsing & encoding
base64 = "0.22"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# storage & secrets
sled = "0.34"
keyring = "3"
age = { version = "0.10", features = ["armor"] }

# misc
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
parking_lot = "0.12"
directories = "5"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

